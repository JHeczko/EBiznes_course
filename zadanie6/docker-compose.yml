networks:
  my-network:
    driver: bridge

services:
  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jheczko/backend_business_app:latest
    container_name: go-backend-service
    ports:
      - "13000:13000"
    networks:
      - my-network
    restart: always

  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jheczko/frontend_business_app:latest
    container_name: react-frontend-service
    ports:
      - "5173:8080"
    depends_on:
      - backend-service
    networks:
      - my-network
    restart: always
