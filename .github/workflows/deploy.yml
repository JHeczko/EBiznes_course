name: CI/CD Build and Push

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # MAGIA: Ten krok bierze nazwę repo i zmienia "JHeczko/EBiznes_course" na "jheczko/ebiznes_course"
      - name: Convert repository name to lowercase
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-backend:latest" >> $GITHUB_ENV
          echo "FRONTEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-frontend:latest" >> $GITHUB_ENV

      # Logowanie do rejestru GitHuba
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Budowanie i wypchnięcie backendu (teraz używa poprawnej zmiennej)
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./zadanie10/backend
          file: ./zadanie10/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      # Budowanie i wypchnięcie frontendu
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./zadanie10/frontend
          file: ./zadanie10/frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}